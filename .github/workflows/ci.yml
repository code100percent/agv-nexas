name: AGV Nexus CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  flutter-quality-gate:
    name: Flutter Lint & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agvnexus

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Execute Automated Unit & Widget Tests
        run: flutter test --coverage

  backend-quality-gate:
    name: FastAPI & Robotics Gateway Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite (Unit, Auth, Transforms, Failure Scenarios)
        run: pytest -v --maxfail=1

  security-and-container-check:
    name: Security Scan & Container Build Verification
    runs-on: ubuntu-latest
    needs: [flutter-quality-gate, backend-quality-gate]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check for Uncommitted Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway & Digital Twin Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: agvnexus-gateway:latest
